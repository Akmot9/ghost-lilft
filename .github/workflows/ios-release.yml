# ==============================================================================
# Ghost Lift — Publication iOS (TestFlight / App Store Connect)
# ==============================================================================
#
# ATTENTION : ce workflow NE PEUT PAS réussir tant que les secrets Apple
# n'ont pas été configurés (aucun compte Apple Developer n'est encore lié au
# dépôt). C'est normal et attendu pour cette première version : le fichier
# est prêt à fonctionner dès que les secrets ci-dessous existent, il suffira
# alors de le lancer manuellement (bouton "Run workflow").
#
# Secrets à créer dans Settings > Secrets and variables > Actions de ce
# dépôt GitHub avant de pouvoir exécuter ce workflow avec succès :
#
#   1. APPLE_API_ISSUER
#        L'« Issuer ID » (identifiant de l'émetteur), affiché en haut du
#        tableau des clés dans App Store Connect.
#
#   2. APPLE_API_KEY
#        La valeur de la colonne « Key ID » de la clé créée (voir ci-dessous).
#
#   3. APPLE_API_KEY_PATH
#        Le chemin ABSOLU, sur le runner macOS, où le fichier de clé privée
#        .p8 doit se trouver au moment du build, par exemple :
#          /Users/runner/private_keys/AuthKey_ABCDE12345.p8
#        Ce n'est PAS le contenu du fichier, seulement son chemin — voir le
#        secret suivant pour fournir le contenu réel du fichier.
#
#   4. APPLE_API_KEY_CONTENT
#        Le contenu du fichier .p8 téléchargé, encodé en base64
#        (ex. `base64 -i AuthKey_ABCDE12345.p8 | pbcopy` sur Mac, ou
#        `base64 -w0 AuthKey_ABCDE12345.p8` sous Linux).
#        Ce secret est nécessaire en plus des trois attendus par Tauri,
#        car un secret GitHub ne peut contenir qu'une chaîne de texte, pas
#        un fichier sur le disque : l'étape « Write App Store Connect API
#        key to disk » ci-dessous décode ce secret et écrit le fichier .p8
#        à l'emplacement indiqué par APPLE_API_KEY_PATH avant le build.
#
# Comment obtenir la clé API App Store Connect (Key ID, Issuer ID, .p8) :
#   1. Se connecter sur https://appstoreconnect.apple.com/access/api
#   2. Aller dans l'onglet « Users and Access » puis « Integrations » /
#      « Keys » (clés API App Store Connect).
#   3. Cliquer sur « Generate API Key » (ou le bouton « + »), donner un nom
#      à la clé et lui attribuer le rôle « Admin » (ou « App Manager » au
#      minimum pour uploader des builds TestFlight).
#   4. Télécharger le fichier .p8 immédiatement : Apple ne permet de le
#      télécharger qu'UNE SEULE FOIS. Le conserver précieusement.
#   5. Noter le « Key ID » (→ secret APPLE_API_KEY) et l'« Issuer ID »
#      affiché en haut de la page (→ secret APPLE_API_ISSUER).
#   6. Encoder le fichier .p8 en base64 (→ secret APPLE_API_KEY_CONTENT) et
#      choisir un chemin de destination sur le runner (→ secret
#      APPLE_API_KEY_PATH).
#
# Documentation officielle Tauri v2 :
#   - Build/upload App Store : https://v2.tauri.app/distribute/app-store/
#   - Signature iOS           : https://v2.tauri.app/distribute/sign/ios/
# ==============================================================================

name: iOS Release (TestFlight / App Store Connect)

on:
  # Déclenchement manuel uniquement : ce workflow ne doit pas se lancer sur
  # push/PR tant qu'il ne peut pas réussir (pas encore de secrets Apple),
  # pour éviter de spammer des notifications d'échec.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build & upload iOS app
    runs-on: macos-14 # Xcode récent préinstallé, requis pour builder iOS.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Install npm dependencies
        run: npm ci

      # Écrit le fichier de clé privée .p8 sur le disque à partir du secret
      # base64, à l'emplacement attendu par APPLE_API_KEY_PATH (voir le bloc
      # de commentaires en haut du fichier pour le détail des secrets).
      - name: Write App Store Connect API key to disk
        env:
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p "$(dirname "$APPLE_API_KEY_PATH")"
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"

      # src-tauri/gen/apple est absent du dépôt (gitignoré, généré par la
      # CLI Tauri), donc il n'existera jamais sur un checkout frais : cette
      # étape s'exécute donc systématiquement à chaque run, ce qui est le
      # comportement voulu — le projet Xcode doit être régénéré à chaque fois.
      - name: Initialize iOS Xcode project
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            npm run tauri ios init -- --ci
          fi

      # Signature automatique via clé API App Store Connect (méthode
      # documentée par Tauri) : les trois variables d'environnement
      # APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_PATH suffisent,
      # Xcode gère lui-même la récupération du certificat et du profil de
      # provisionnement le temps du build.
      - name: Build iOS app
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          npm run tauri ios build -- \
            --export-method app-store-connect \
            --build-number "${{ github.run_number }}" \
            --ci

      # Upload vers TestFlight / App Store Connect avec les outils Apple
      # (xcrun altool), pour éviter d'ajouter une dépendance Fastlane/Ruby
      # supplémentaire pour cette première version. Pour des équipes qui
      # veulent un contrôle plus riche (métadonnées, captures d'écran,
      # notes de version automatisées, etc.), Fastlane (pilot/deliver) est
      # l'alternative la plus courante et pourra être introduite plus tard.
      - name: Upload to TestFlight
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          IPA_PATH=$(find src-tauri/gen/apple/build/arm64 -maxdepth 1 -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No .ipa file found under src-tauri/gen/apple/build/arm64" >&2
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPLE_API_KEY" \
            --apiIssuer "$APPLE_API_ISSUER"
