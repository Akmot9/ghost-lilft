name: iOS · TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Envoyer le build vers TestFlight
        required: true
        type: boolean
        default: true
      build_number:
        description: Numéro de build Apple (vide = numéro du workflow)
        required: false
        type: string
  push:
    tags:
      - "ios-v*"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Construire et publier l’IPA
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_PRODUCT_NAME: ${{ vars.IOS_PRODUCT_NAME }}
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      IOS_PROFILE_NAME: ${{ vars.IOS_PROFILE_NAME || 'Ghost Lift App Store' }}
      IOS_WIDGET_PROFILE_NAME: ${{ vars.IOS_WIDGET_PROFILE_NAME || 'Ghost Lift Widget App Store' }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les variables et secrets Apple
        shell: bash
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          check_value() {
            if [[ -z "$2" ]]; then
              echo "::error::$1 n'est pas configuré dans les variables/secrets GitHub."
              missing=1
            fi
          }

          check_value IOS_BUNDLE_ID "$IOS_BUNDLE_ID"
          check_value APPLE_TEAM_ID "$APPLE_DEVELOPMENT_TEAM"
          check_value APPSTORE_ISSUER_ID "$APPSTORE_ISSUER_ID"
          check_value APPSTORE_API_KEY_ID "$APPSTORE_API_KEY_ID"
          check_value APPSTORE_API_PRIVATE_KEY "$APPSTORE_API_PRIVATE_KEY"
          check_value APPSTORE_CERTIFICATES_FILE_BASE64 "$APPSTORE_CERTIFICATES_FILE_BASE64"
          check_value APPSTORE_CERTIFICATES_PASSWORD "$APPSTORE_CERTIFICATES_PASSWORD"

          if [[ ! "$IOS_BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "::error::IOS_BUNDLE_ID doit être au format DNS inversé, sans underscore."
            missing=1
          fi

          exit "$missing"

      - name: Sélectionner Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Rust et les cibles iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Préparer les outils Tauri iOS
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          pod --version
          npm ci

      - name: Importer le certificat Apple Distribution
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Télécharger le profil App Store
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ vars.IOS_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Assurer l’App ID et le profil de l’extension widget
        shell: bash
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # La Live Activity vit dans une extension WidgetKit, qui a son
          # propre bundle et doit être signée avec son propre profil App
          # Store. Plutôt que d'exiger un aller-retour dans le portail
          # développeur, on crée l'App ID et le profil à la volée via l'API
          # App Store Connect (idempotent : s'ils existent, on ne touche à
          # rien).
          ruby - <<'RUBY'
          require "openssl"
          require "json"
          require "base64"
          require "net/http"
          require "uri"

          def b64(payload)
            Base64.urlsafe_encode64(JSON.generate(payload)).delete("=")
          end

          key = OpenSSL::PKey::EC.new(ENV.fetch("APPSTORE_API_PRIVATE_KEY"))
          header = { alg: "ES256", kid: ENV.fetch("APPSTORE_API_KEY_ID"), typ: "JWT" }
          claims = {
            iss: ENV.fetch("APPSTORE_ISSUER_ID"),
            iat: Time.now.to_i,
            exp: Time.now.to_i + 1200,
            aud: "appstoreconnect-v1",
          }
          signing_input = "#{b64(header)}.#{b64(claims)}"
          der = key.sign(OpenSSL::Digest::SHA256.new, signing_input)
          sequence = OpenSSL::ASN1.decode(der)
          r, sv = sequence.value.map { |part| part.value.to_s(2) }
          raw = r.rjust(32, 0.chr) + sv.rjust(32, 0.chr)
          token = "#{signing_input}.#{Base64.urlsafe_encode64(raw).delete('=')}"

          def api(token, method, path, body = nil)
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = true
            request = (method == :get ? Net::HTTP::Get : Net::HTTP::Post).new(uri)
            request["Authorization"] = "Bearer #{token}"
            request["Content-Type"] = "application/json"
            request.body = JSON.generate(body) if body
            response = http.request(request)
            unless response.code.to_i.between?(200, 299)
              raise "#{method} #{path} -> #{response.code} : #{response.body[0, 500]}"
            end
            JSON.parse(response.body)
          end

          widget_bundle = "#{ENV.fetch('IOS_BUNDLE_ID')}.RestWidget"
          profile_name = ENV.fetch("IOS_WIDGET_PROFILE_NAME")

          found = api(token, :get, "/v1/bundleIds?filter[identifier]=#{widget_bundle}&limit=5")
          record = found["data"].find { |item| item.dig("attributes", "identifier") == widget_bundle }
          if record
            bundle_id = record["id"]
            puts "App ID déjà présent : #{widget_bundle}"
          else
            created = api(token, :post, "/v1/bundleIds", {
              data: {
                type: "bundleIds",
                attributes: { identifier: widget_bundle, name: "Ghost Lift Rest Widget", platform: "IOS" },
              },
            })
            bundle_id = created.dig("data", "id")
            puts "App ID créé : #{widget_bundle}"
          end

          profiles = api(token, :get, "/v1/profiles?filter[name]=#{URI.encode_www_form_component(profile_name)}&limit=5")
          active = profiles["data"].find do |item|
            item.dig("attributes", "name") == profile_name &&
              item.dig("attributes", "profileState") == "ACTIVE"
          end
          if active
            puts "Profil déjà actif : #{profile_name}"
          else
            certificates = api(token, :get, "/v1/certificates?filter[certificateType]=IOS_DISTRIBUTION,DISTRIBUTION&limit=50")
            certificate_refs = certificates["data"].map { |c| { type: "certificates", id: c["id"] } }
            raise "aucun certificat de distribution dans le compte" if certificate_refs.empty?

            api(token, :post, "/v1/profiles", {
              data: {
                type: "profiles",
                attributes: { name: profile_name, profileType: "IOS_APP_STORE" },
                relationships: {
                  bundleId: { data: { type: "bundleIds", id: bundle_id } },
                  certificates: { data: certificate_refs },
                },
              },
            })
            puts "Profil créé : #{profile_name}"
          end
          RUBY

      - name: Télécharger le profil App Store du widget
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ vars.IOS_BUNDLE_ID }}.RestWidget
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Créer la configuration iOS éphémère
        id: ios-config
        shell: bash
        run: |
          set -euo pipefail
          product_name="${IOS_PRODUCT_NAME:-Revenant}"
          config="$(jq -cn \
            --arg identifier "$IOS_BUNDLE_ID" \
            --arg productName "$product_name" \
            '{identifier: $identifier, productName: $productName}')"
          echo "json=$config" >> "$GITHUB_OUTPUT"

      - name: Initialiser la cible iOS
        shell: bash
        env:
          IOS_TAURI_CONFIG: ${{ steps.ios-config.outputs.json }}
        run: |
          set -euo pipefail
          if [[ ! -d src-tauri/gen/apple ]]; then
            npm run tauri ios init -- --ci --config "$IOS_TAURI_CONFIG"
          fi

      - name: Installer la déclaration de confidentialité
        run: cp src-tauri/PrivacyInfo.xcprivacy "src-tauri/gen/apple/PrivacyInfo.xcprivacy"

      - name: Installer les icônes de l’app dans le projet Xcode
        shell: bash
        run: |
          set -euo pipefail
          # « ios init » remplit le catalogue avec les icônes Tauri par défaut ;
          # « tauri icon » n'écrit dans gen/apple que s'il existe déjà. Les
          # fichiers de src-tauri/icons/ios portent exactement les mêmes noms
          # que ceux du template : on les copie par-dessus.
          cp src-tauri/icons/ios/AppIcon-*.png \
             src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/

      - name: Greffer la Live Activity au projet Xcode
        shell: bash
        run: |
          set -euo pipefail
          # L'extension WidgetKit qui dessine la Live Activity du repos. Ses
          # sources vivent dans le dépôt (src-tauri/ios-widget) ; les
          # attributs partagés viennent du plugin — ActivityKit apparie
          # l'app et l'extension sur ce type, il doit être identique.
          mkdir -p src-tauri/gen/apple/RestWidget
          cp src-tauri/ios-widget/RestWidgetBundle.swift src-tauri/gen/apple/RestWidget/
          cp src-tauri/tauri-plugin-rest-activity/ios/Sources/RestActivityAttributes.swift \
             src-tauri/gen/apple/RestWidget/

          ruby - <<'RUBY'
          require "yaml"
          path = "src-tauri/gen/apple/project.yml"
          spec = YAML.load_file(path)
          app_target = spec["targets"].keys.find { |k| k.end_with?("_iOS") }
          raise "cible iOS introuvable dans #{path}" unless app_target

          spec["targets"]["RestWidget"] = {
            "type" => "app-extension",
            "platform" => "iOS",
            "deploymentTarget" => "16.2",
            "sources" => [{ "path" => "RestWidget" }],
            "info" => {
              "path" => "RestWidget/Info.plist",
              "properties" => {
                "CFBundleDisplayName" => "Revenant",
                "NSExtension" => {
                  "NSExtensionPointIdentifier" => "com.apple.widgetkit-extension",
                },
              },
            },
            "settings" => {
              "base" => {
                "PRODUCT_BUNDLE_IDENTIFIER" => "#{ENV.fetch('IOS_BUNDLE_ID')}.RestWidget",
                "CODE_SIGN_STYLE" => "Manual",
                "CODE_SIGN_IDENTITY" => "Apple Distribution",
                "DEVELOPMENT_TEAM" => ENV.fetch("APPLE_DEVELOPMENT_TEAM"),
                "PROVISIONING_PROFILE_SPECIFIER" => ENV.fetch("IOS_WIDGET_PROFILE_NAME"),
                "TARGETED_DEVICE_FAMILY" => "1",
                "SWIFT_VERSION" => "5.0",
                "SKIP_INSTALL" => "YES",
              },
            },
          }

          dependencies = (spec["targets"][app_target]["dependencies"] ||= [])
          dependencies << { "target" => "RestWidget", "embed" => true }

          File.write(path, spec.to_yaml)
          puts "Extension RestWidget greffée, embarquée par #{app_target}"
          RUBY

      - name: Forcer la signature manuelle avec le profil App Store
        shell: bash
        run: |
          set -euo pipefail
          # Le projet généré par Tauri utilise la signature automatique, qui
          # exige un compte Apple connecté dans Xcode. En CI on signe
          # manuellement avec le certificat Distribution importé et le profil
          # App Store téléchargé.
          ruby - <<'RUBY'
          require "yaml"
          path = "src-tauri/gen/apple/project.yml"
          spec = YAML.load_file(path)
          target = spec["targets"].keys.find { |k| k.end_with?("_iOS") }
          raise "cible iOS introuvable dans #{path}" unless target
          base = ((spec["targets"][target]["settings"] ||= {})["base"] ||= {})
          base["CODE_SIGN_STYLE"] = "Manual"
          base["CODE_SIGN_IDENTITY"] = "Apple Distribution"
          base["DEVELOPMENT_TEAM"] = ENV.fetch("APPLE_DEVELOPMENT_TEAM")
          base["PROVISIONING_PROFILE_SPECIFIER"] = ENV.fetch("IOS_PROFILE_NAME")
          base["TARGETED_DEVICE_FAMILY"] = "1" # iPhone uniquement
          File.write(path, spec.to_yaml)
          puts "Signature manuelle configurée pour #{target}"
          RUBY
          (cd src-tauri/gen/apple && xcodegen generate)

          # L'app n'utilise que du HTTPS standard : déclarer l'exemption de
          # chiffrement pour que TestFlight n'attende pas de réponse manuelle.
          ios_plist="$(find src-tauri/gen/apple -maxdepth 2 -name Info.plist -path '*_iOS/*' -print -quit)"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$ios_plist" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$ios_plist"

          # La Live Activity du repos ne s'affiche que si l'app le déclare.
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivities bool true" "$ios_plist" \
            || /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivities true" "$ios_plist"

          # L'export de l'archive a lui aussi besoin du mapping bundle → profil.
          cat > src-tauri/gen/apple/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_PROFILE_NAME}</string>
              <key>${IOS_BUNDLE_ID}.RestWidget</key>
              <string>${IOS_WIDGET_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          plutil -lint src-tauri/gen/apple/ExportOptions.plist

      - name: Construire l’IPA signée
        shell: bash
        env:
          IOS_TAURI_CONFIG: ${{ steps.ios-config.outputs.json }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          build_number="${REQUESTED_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"

          if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Le numéro de build doit être un entier positif."
            exit 1
          fi

          npm run tauri ios build -- \
            --export-method app-store-connect \
            --build-number "$build_number" \
            --config "$IOS_TAURI_CONFIG"

      - name: Localiser l’IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          ipa_path="$(find src-tauri/gen/apple/build -type f -name '*.ipa' -print -quit)"

          if [[ -z "$ipa_path" ]]; then
            echo "::error::Tauri n'a produit aucun fichier IPA."
            exit 1
          fi

          echo "path=$ipa_path" >> "$GITHUB_OUTPUT"
          echo "IPA prête : $ipa_path"

      - name: Conserver l’IPA dans les artefacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.run_number }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Envoyer vers TestFlight
        if: github.event_name == 'push' || inputs.upload_to_testflight == true
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: "true"
