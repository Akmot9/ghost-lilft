name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    name: Types et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run type-check

      - name: Lancer les tests unitaires
        run: npm run test:unit

  e2e:
    name: Tests end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Seul Chromium est configuré dans playwright.config.ts.
      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests end-to-end
        run: npm run test:e2e

      # Le rapport HTML est le seul moyen de comprendre un échec e2e a posteriori.
      - name: Publier le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    name: Tests Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # La crate dépend de tauri, qui ne compile pas sans les en-têtes WebKitGTK.
      - name: Installer les dépendances système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Installer la chaîne Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Mettre en cache les dépendances Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Lancer les tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
