[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
# Notification locale de fin de repos : programmée à l'échéance du minuteur,
# elle sonne même l'écran verrouillé.
tauri-plugin-notification = "2"
# `bundled` : le SQLite est compilé avec l'app plutôt que pris au système —
# indispensable sur iOS, et garantit la même version qu'en test.
rusqlite = { version = "0.32", features = ["bundled"] }
# Décomposition NFD pour `slugify` (mutations.rs) : « Développé couché » doit
# donner le même slug que celui que produisait `String.normalize('NFD')` côté
# TypeScript — les slugs existants des utilisateurs en dépendent.
unicode-normalization = "0.1"

[dev-dependencies]
# Base SQLite sur un vrai fichier temporaire (nettoyé à la fin du test) : les
# tests en mémoire ne peuvent pas être fermés puis rouverts, donc ils ne
# prouvent rien sur ce qui est réellement écrit sur le disque.
tempfile = "3"
# `test` : module `tauri::test` (MockRuntime, mock_builder, get_ipc_response),
# qui permet d'invoquer une commande par son nom sans interface graphique.
tauri = { version = "2.11.3", features = ["test"] }
